# Feature List                            Edit, add or remove features to be presented.
features                                  :

  - title                                 : Limits that fit your day
    description                           : "Group your apps, then give each group as many rules as you need: pause them outright, or allow a set number of minutes. Use them all day, on a schedule, during a Focus or at a place."
    fontawesome_icon_name                 : sliders-h

  - title                                 : Access Groups protect your time
    description                           : "Flips the usual screen time rules on their head. Work apps open only during work hours or at the office. Social apps open only in the evening. The rest of the time they're closed, so evenings and weekends stay yours."
    fontawesome_icon_name                 : door-open

  - title                                 : Works with your Focus
    description                           : "Add the Clearer filter to any iOS Focus and choose which groups it pauses, or which ones it opens. Your Do Not Disturb, Work and Sleep Focuses start doing more for you."
    fontawesome_icon_name                 : moon

  - title                                 : Knows where you are
    description                           : "Pause or open apps at home, at work, at the gym, or everywhere except those places. Your places stay on your device."
    fontawesome_icon_name                 : map-marker-alt

  - title                                 : Different rules for different moments
    description                           : "A group can have a work-hours rule, an evening allowance and a Focus rule all at once. When rules overlap, the most restrictive one applies, so there's nothing to rank or untangle."
    fontawesome_icon_name                 : layer-group

  - title                                 : Pauses, not punishments
    description                           : "Shields say a group is paused and name the rule responsible, in plain, encouraging words. Where you set it up, you can allow a few extra minutes."
    fontawesome_icon_name                 : pause-circle

  - title                                 : Streaks and progress
    description                           : "Watch your streaks grow and see your time trend down."
    fontawesome_icon_name                 : seedling

  - title                                 : Private by design
    description                           : "No accounts, no analytics, no tracking, no servers. Your apps, places and usage never leave your device."
    fontawesome_icon_name                 : lock


